name: Deploy to Lolipop via SSH

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

      - name: Deploy files to Lolipop server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '2222' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH || '~/web/task' }}
        run: |
          # 反映先パスの末尾スラッシュを正規化
          TARGET_DIR="${SSH_TARGET_PATH%/}"

          echo "Connecting to ${SSH_HOST}:${SSH_PORT} as ${SSH_USER}..."

          # リモート側にターゲットディレクトリが存在しない場合は作成
          sshpass -p "$SSH_PASSWORD" ssh -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p ${TARGET_DIR}"

          sshpass -p "$SSH_PASSWORD" rsync -avz \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.vscode*' \
            --exclude='dev_tools/' \
            --exclude='docs/' \
            --exclude='static/' \
            --exclude='data/backups/' \
            --exclude='data/thumbnails/' \
            --exclude='img_backup_original_*/' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='*.bak*' \
            --exclude='*.backup*' \
            ./ "${SSH_USER}@${SSH_HOST}:${TARGET_DIR}/"

          echo "Deploy completed successfully!"
